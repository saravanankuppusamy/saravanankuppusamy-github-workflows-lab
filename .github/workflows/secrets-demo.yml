name: Secrets Demo Workflow

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  demo-job:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Use secrets in Bash
        shell: bash
        env:
          DB_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          echo "✓ Secrets successfully loaded"
          echo "Database password length: ${#DB_PASSWORD}"
          echo "API key length: ${#API_KEY}"

      - name: Use secrets in PowerShell
        shell: pwsh
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: |
          Write-Host "✓ Slack webhook loaded"
          Write-Host "Webhook URL length: $($env:SLACK_WEBHOOK.Length)"

      - name: Use secrets as action inputs
        uses: actions/github-script@v8
        with:
          script: |
            console.log('Docker credentials available: Yes');
            console.log('Workflow completed successfully');

      - name: Demonstrate secret masking
        shell: bash
        env:
          SECRET_VALUE: ${{ secrets.DATABASE_PASSWORD }}
        run: |
          echo "Attempting to output secret..."
          echo "Secret value: ${SECRET_VALUE}"
          # GitHub automatically masks the actual value in logs

