name: Workflow Troubleshooting Lab

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run Lab Test
    runs-on: self-hosted

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Say hello
        run: echo "Hello from GitHub Actions!"

      - name: Check operating system
        run: echo "Running on $RUNNER_OS"

      - name: Run test
        run: |
            echo "Starting test..."
            exit 1
