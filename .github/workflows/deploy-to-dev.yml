name: Deploy to Development

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    environment: development

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Deploy using development secret
        shell: bash
        env:
          DEV_KEY: ${{ secrets.DEV_API_KEY }}
        run: |
          echo "Deploying to development..."
          echo "Using development API key (masked in logs)"
          # Development deployment commands would go here

      - name: Confirm deployment
        run: |
          echo "✓ Development deployment completed successfully"

